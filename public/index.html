<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3dSpaceship — Lobby</title>
  <style>
    body { font-family: monospace; background: #0b0e1a; color: #dfe6ff; display: flex; justify-content: center; padding-top: 4vh; }
    main { width: 720px; }
    h1 { font-size: 1.2rem; }
    input, button { font-family: inherit; font-size: 1rem; padding: 0.4rem; }
    input { width: 200px; }
    ul { list-style: none; padding: 0; display: flex; gap: 1rem; flex-wrap: wrap; margin: 0; }
    li { padding: 0.2rem 0.5rem; border: 1px solid #2a3050; }
    .hidden { display: none; }
    #lobby-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    #leave-btn { background: #2a1520; color: #ff99aa; border: 1px solid #773344; cursor: pointer; padding: 0.25rem 0.6rem; font-size: 0.85rem; }
    #leave-btn:hover { background: #441f30; border-color: #aa4466; }
    #status, #controls-hint { color: #7f8ab8; font-size: 0.85rem; }
    #tuning-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.6rem;
      font-size: 0.85rem;
      background: #141829;
      padding: 0.4rem 0.8rem;
      border: 1px solid #2a3050;
      border-radius: 4px;
    }
    #drag-form { margin: 0; font-size: 0.85rem; display: flex; align-items: center; gap: 0.4rem; }
    #drag-form input { width: 80px; font-size: 0.85rem; }
    #drag-form button { font-size: 0.85rem; padding: 0.2rem 0.5rem; }
    #laser-linger-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: #dfe6ff;
    }
    #laser-linger-slider {
      width: 130px;
      cursor: pointer;
    }
    #laser-linger-val {
      color: #00ff88;
      font-weight: bold;
    }
    #game { width: 720px; height: 450px; display: block; border: 1px solid #2a3050; background: #000000; }
    #game-wrap { position: relative; width: 720px; }
    #game-wrap:fullscreen, #game-wrap:-webkit-full-screen {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000000;
    }
    #game-wrap:fullscreen #game, #game-wrap:-webkit-full-screen #game {
      width: 100vw;
      height: 100vh;
      border: none;
    }
    #hud {
      position: absolute;
      bottom: 12px;
      left: 14px;
      margin: 0;
      pointer-events: none;
      color: #9ab0e0;
      font-size: 0.85rem;
      background: rgba(11, 14, 26, 0.7);
      padding: 4px 10px;
      border: 1px solid rgba(42, 48, 80, 0.7);
      border-radius: 4px;
    }
    /* reticle: thin crosshair with an open center, marking the exact ray the
       server fires along; pointer-events none so canvas clicks still lock */
    #reticle {
      position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #reticle::before, #reticle::after {
      content: ''; position: absolute; background: rgba(0, 255, 102, 0.8);
    }
    #reticle::before { left: 0; right: 0; top: 9px; height: 2px;
      -webkit-mask: linear-gradient(90deg, #000 35%, transparent 35% 65%, #000 65%);
      mask: linear-gradient(90deg, #000 35%, transparent 35% 65%, #000 65%); }
    #reticle::after { top: 0; bottom: 0; left: 9px; width: 2px;
      -webkit-mask: linear-gradient(#000 35%, transparent 35% 65%, #000 65%);
      mask: linear-gradient(#000 35%, transparent 35% 65%, #000 65%); }
  </style>
</head>
<body>
  <main>
    <h1>3dSpaceship</h1>

    <form id="join-form">
      <input id="name-input" placeholder="your name" maxlength="24" autocomplete="off" required />
      <button type="submit">Join</button>
    </form>

    <div id="lobby" class="hidden">
      <div id="lobby-topbar">
        <ul id="player-list"></ul>
        <button id="leave-btn" type="button">Exit to Lobby</button>
      </div>
      <div id="game-wrap">
        <canvas id="game"></canvas>
        <div id="reticle"></div>
        <p id="hud">roll 0°/s &nbsp; pitch 0°/s &nbsp; speed 0.0</p>
      </div>
      <p id="controls-hint">click canvas: capture mouse &nbsp;|&nbsp; mouse: yaw/pitch &nbsp;|&nbsp; q/e: roll &nbsp;|&nbsp; w/s: fwd/back &nbsp;|&nbsp; a/d: strafe &nbsp;|&nbsp; shift: boost &nbsp;|&nbsp; space: fire laser &nbsp;|&nbsp; [/]: linger &nbsp;|&nbsp; f: fullscreen &nbsp;|&nbsp; g: toggle grid &nbsp;|&nbsp; esc: release</p>
      <div id="tuning-panel">
        <form id="drag-form">
          <label>drag: <span id="drag-current">…</span></label>
          <input id="drag-input" type="number" step="0.05" min="0" max="5" placeholder="new value" />
          <button type="submit">set</button>
        </form>
        <div id="laser-linger-wrap">
          <label for="laser-linger-slider">laser linger: <span id="laser-linger-val">4</span> frames</label>
          <input id="laser-linger-slider" type="range" min="1" max="60" value="4" step="1" />
        </div>
      </div>
    </div>

    <p id="status"></p>
  </main>

  <script src="/lib/colyseus.js"></script>
  <script type="importmap">
    { "imports": {
      "three": "/lib/three/three.module.js",
      "three/addons/": "/lib/three-addons/"
    } }
  </script>
  <script type="module" src="/client.js"></script>
</body>
</html>
